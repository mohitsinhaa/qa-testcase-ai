<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QA Test Case Generator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>🧪 AI QA Test Case Generator</h1>
      <p>Paste a requirement or user story. AI writes the test cases.</p>
    </header>

    <section class="input-card">
      <label for="requirement">Requirement / User Story</label>
      <textarea id="requirement" rows="8" placeholder="e.g. As a user, I want to reset my password via email so that I can regain access to my account if I forget it. The reset link should expire after 30 minutes."></textarea>

      <div class="row">
        <div class="field">
          <label for="count"># of Test Cases</label>
          <input type="number" id="count" min="1" max="30" value="8" />
        </div>
        <div class="field grow">
          <label for="focus">Focus Areas (optional)</label>
          <input type="text" id="focus" placeholder="e.g. security, mobile UI, API validation" />
        </div>
      </div>

      <button id="generateBtn">Generate Test Cases</button>
      <p id="errorMsg" class="error"></p>
    </section>

    <section id="resultsSection" class="results hidden">
      <div class="results-header">
        <h2>Generated Test Cases</h2>
        <button id="exportBtn">Export CSV</button>
      </div>
      <div class="table-wrap">
        <table id="resultsTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Type</th>
              <th>Priority</th>
              <th>Preconditions</th>
              <th>Steps</th>
              <th>Test Data</th>
              <th>Expected Result</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </section>

    <div id="loadingOverlay" class="loading hidden">
      <div class="spinner"></div>
      <p>Generating test cases…</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
